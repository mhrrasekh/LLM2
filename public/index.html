<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM2 — AI Control Center</title>
  <meta name="description" content="Browser LLM Bridge — chat with multiple providers, manage projects, memory and developer tools.">
  <link rel="stylesheet" href="/styles/base.css">
  <script>
    // Apply the stored/system theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem("llm2-theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.setProperty("color-scheme", theme);
      } catch (e) { /* storage blocked */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app">
    <header class="topbar">
      <button class="icon-button sidebar-toggle" id="sidebarToggle" type="button"
              aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar"></button>

      <a class="brand" href="#/dashboard" aria-label="LLM2 — AI Control Center">
        <span class="brand-mark">LLM2</span>
        <span class="brand-sub">AI Control Center</span>
      </a>

      <div class="topbar-right">
        <span class="status-pill" id="serviceStatus" role="status" aria-live="polite" aria-label="Service status">checking…</span>
        <a class="icon-button" href="#/settings" aria-label="Settings"></a>
        <button class="icon-button" id="themeToggle" type="button"
                aria-label="Switch to light theme" aria-pressed="false"></button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <span class="muted">Browser LLM Bridge · localhost</span>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <script type="module" src="/scripts/main.js"></script>
</body>
</html>
